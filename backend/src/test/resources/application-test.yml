spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:finflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

finflow:
  security:
    jwt-secret: dGhpc2lzYXZlcnlzZWNyZXRrZXlmb3Jqd3RzaWduaW5nMTIzNDU=
    pii-encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    seed:
      super-admin:
        email: admin@finflow.internal
        password: AdminSecurePassword123!
        first-name: Super
        last-name: Admin
        phone: "+1234567890"
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    exposed-headers: X-Correlation-ID
    allow-credentials: true
    max-age: 3600

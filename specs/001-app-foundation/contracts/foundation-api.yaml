openapi: 3.1.0
info:
  title: FinFlow Foundation API Contracts
  version: 1.0.0
  description: >
    OpenAPI 3.1 specification for FinFlow Module 1 (Application Foundation) shared endpoints,
    error structures (RFC 7807 Problem Details), and base response schemas.

paths:
  /actuator/health:
    get:
      summary: System Health & Probes
      description: Returns service liveness and readiness status, including database and Redis connectivity.
      operationId: getHealth
      tags:
        - Foundation Monitoring
      responses:
        '200':
          description: System is operational and healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: One or more critical dependencies (PostgreSQL / Redis) are down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /actuator/info:
    get:
      summary: Application Metadata
      description: Returns running application version, active Spring profiles, and build details.
      operationId: getAppInfo
      tags:
        - Foundation Monitoring
      responses:
        '200':
          description: Application metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    type: object
                    properties:
                      name:
                        type: string
                        example: finflow-backend
                      version:
                        type: string
                        example: 1.0.0
                      activeProfiles:
                        type: array
                        items:
                          type: string
                        example: ["dev"]

components:
  parameters:
    CorrelationIdHeader:
      name: X-Correlation-ID
      in: header
      required: false
      description: Unique correlation identifier for request tracing across modules.
      schema:
        type: string
        format: uuid
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d

  schemas:
    HealthStatus:
      type: object
      required:
        - status
        - components
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE]
          example: UP
        components:
          type: object
          properties:
            db:
              type: object
              properties:
                status:
                  type: string
                  example: UP
                details:
                  type: object
                  properties:
                    database:
                      type: string
                      example: PostgreSQL
            redis:
              type: object
              properties:
                status:
                  type: string
                  example: UP
                details:
                  type: object
                  properties:
                    version:
                      type: string
                      example: 7.2.4

    ProblemDetail:
      type: object
      description: RFC 7807 Problem Details for HTTP APIs standard error response schema.
      required:
        - type
        - title
        - status
        - instance
        - correlationId
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type.
          example: https://api.finflow.com/errors/bad-request
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Bad Request
        status:
          type: integer
          description: The HTTP status code generated by the origin server.
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence of the problem.
          example: Invalid input parameters provided.
        instance:
          type: string
          description: URI reference identifying the specific occurrence of the problem.
          example: /api/v1/auth/login
        correlationId:
          type: string
          format: uuid
          description: MDC correlation ID for server log cross-referencing.
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        timestamp:
          type: string
          format: date-time
          description: UTC timestamp when the error occurred.
          example: 2026-10-12T13:45:30Z
        errors:
          type: array
          description: Optional list of field-level validation errors.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: email
        rejectedValue:
          type: string
          nullable: true
          example: invalid-email
        message:
          type: string
          example: Must be a well-formed email address
